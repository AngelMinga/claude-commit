<svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 40 40">
  <!-- Línea de commits de git -->
  <rect x="3" y="18.5" width="9" height="3" rx="1.5" fill="#6C707E"/>
  <rect x="28" y="18.5" width="9" height="3" rx="1.5" fill="#6C707E"/>
  <!-- Nodo de commit -->
  <circle cx="20" cy="20" r="10.5" fill="#FFFFFF" stroke="#D97757" stroke-width="3"/>
